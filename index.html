<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Formatador + IN100 - Beta 3</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="card">

      <div class="badge">
        BETA 3
      </div>

      <h1>
        Formatador + Consulta IN100
      </h1>

      <p class="descricao">
        Consulta em lote de IN100 de clientes. Para consultar, anexe uma planilha com as seguintes informações:
      </p>

      <div class="formatos">

        <div>
          <span>1ª coluna</span>
          <strong>CPF</strong>
        </div>

        <div>
          <span>2ª coluna</span>
          <strong>BENEFÍCIO</strong>
        </div>

      </div>

      <form id="formulario">

        <label class="upload">

          <input
            type="file"
            id="arquivo"
            name="arquivo"
            accept=".xlsx,.xls"
            required
          >

          <div class="upload-content">

            <div class="icone">
              📄
            </div>

            <strong>
              Escolha sua planilha
            </strong>

            <span id="nomeArquivo">
              XLSX ou XLS
            </span>

          </div>

        </label>

        <button
          type="submit"
          id="btnProcessar"
        >
          Formatar e consultar IN100
        </button>

      </form>

      <div
        id="status"
        class="status"
      ></div>

    </div>

  </main>

  <script src="script.js?v=3"></script>

</body>
</html>
